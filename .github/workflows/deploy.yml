name: Deploy to Xserver

on:
  push:
    branches:
      - main  # mainブランチにpushしたときに実行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      # ⚠ --delete は「dist/ に無いものをサーバーから消す」動作をします。
      #
      # 公式LINEの受信は public_html/api/line/ に置いてあり、
      # ビルド結果(dist/)には含まれません。除外しないと、ホームページを
      # 更新するたびにLINEの受信口が消え、お問い合わせが届かなくなります。
      #
      # 守るのは api/line/ だけにしています。api/ 全体を除外すると、
      # 将来そこへ置いた要らないものが消せなくなるためです。
      # LINEの設定と受信データは public_html の外(private/)にあるので、
      # ここでの除外とは別に守られています。
      #
      # この除外が効いているかは scripts/deploy-exclude-test.sh で確かめられます。
      - name: Deploy via rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=api/line/
          path: dist/
          # 💡 Xserverの公開ディレクトリ
          # your-domain.com の部分は実際のドメイン名に変更してください
          remote_path: /home/xs674757/relagarden.jp/public_html/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022