name: LINE auto-reply runner

# LINEの遅延受付を5分ごとに動かす。
#
# **Xserverのcrontabは使わない。**
# このサーバーのcrontabは、既存の内容をそのまま書き戻すだけでも
# 拒否される（"bad minute"）。書き戻しを続けると、既存のCron 9件を
# 壊しかねないため、GitHub側から呼ぶ形にしている。
#
# ここは「呼ぶだけ」。送るかどうかを決めるのは、Xserver側の
# private/line-config.php の auto_reply_enabled。
# それが false の間、実行ファイルは保存領域にもLINEにも触れずに終わる。
#
# **script: の中は半角英数字だけにする。**
# 日本語コメントを入れた版はSSHが status 255 で落ちた。
# 説明はこの外側（YAMLのコメント）に書く。

on:
  schedule:
    # 5分ごと。GitHubの予定実行は数分ずれることがある。
    # 短い受付案内は「最後の受信から30分後」なので、多少ずれても差し支えない。
    - cron: '*/5 * * * *'
  # 手で1回だけ動かして確かめるとき用。
  workflow_dispatch:

# 前の実行が終わる前に次を始めない。二重送信を防ぐ。
# **走っている実行を打ち切らない**（送信の途中で切ると結果が分からなくなる）。
concurrency:
  group: relagarden-line-auto-reply
  cancel-in-progress: false

jobs:
  run:
    # 予定実行は既定ブランチでしか動かないが、明示しておく。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 詰まった実行を次の回まで残さない。
    timeout-minutes: 5
    steps:
      # 実行ファイルの場所は $HOME から組み立てる。
      # 公開リポジトリなので、サーバーのユーザー名をここへ書かない。
      # PHPの場所も決め打ちにせず、あるものを探す。
      # どこまで進んだかが分かるよう、段階ごとに印を出す。
      - name: Run LINE auto-reply on Xserver
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.XSERVER_HOST }}
          username: ${{ secrets.XSERVER_USER }}
          key: ${{ secrets.XSERVER_SSH_KEY }}
          port: 10022
          script: |
            echo "stage=start"
            runner="$HOME/relagarden.jp/api-line-bin/run-auto-reply.php"
            if [ ! -f "$runner" ]; then
              echo "stage=runner-missing"
              exit 1
            fi
            echo "stage=runner-found"
            php_bin=""
            for c in /usr/bin/php8.4 /usr/bin/php8.3 /usr/bin/php8.2 /usr/bin/php8.1 "$(command -v php 2>/dev/null)" /usr/bin/php; do
              [ -n "$c" ] || continue
              [ -x "$c" ] || continue
              v="$("$c" -r 'echo PHP_MAJOR_VERSION*100+PHP_MINOR_VERSION;' 2>/dev/null)"
              case "$v" in ""|*[!0-9]*) continue ;; esac
              echo "stage=php-candidate bin=$c ver=$v"
              if [ "$v" -ge 801 ]; then
                php_bin="$c"
                break
              fi
            done
            if [ -z "$php_bin" ]; then
              echo "stage=php81-missing"
              exit 1
            fi
            echo "stage=php-selected bin=$php_bin"
            if ! "$php_bin" -l "$runner" >/dev/null 2>&1; then
              echo "stage=lint-failed"
              exit 1
            fi
            echo "stage=lint-ok"
            "$php_bin" "$runner" >/dev/null 2>&1
            status=$?
            echo "stage=done exit=$status"
            exit $status
